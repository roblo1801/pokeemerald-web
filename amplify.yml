version: 1
frontend:
  phases:
    preBuild:
      commands:
        - curl -s https://packagecloud.io/install/repositories/github/git-lfs/script.rpm.sh | bash
        - yum install -y git-lfs
        - git lfs install
        - git lfs pull
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - 'node_modules/**/*'
      - '.next/cache/**/*'
